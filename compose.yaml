
services:
  db:
    image: mysql:8.4
    container_name: wallet_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wallet_db
      MYSQL_USER: admin
      MYSQL_PASSWORD: local_dev_password
      MYSQL_ROOT_PASSWORD: local_root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -plocal_root_password"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  app:
    build: .
    container_name: wallet_api
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: wallet_db
      DB_USER: admin
      DB_PASSWORD: local_dev_password
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
